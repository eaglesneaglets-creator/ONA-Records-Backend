{# For when the button does nothing (some clients, some screen readers). Args: url. #}
<p style="margin:24px 0 0;padding-top:20px;border-top:1px solid {{ s.border }};font-family:{{ s.font }};font-size:12.5px;line-height:19px;color:{{ s.mute }};">
  Button not working? Copy this link into your browser:<br>
  <a href="{{ url }}" style="color:{{ s.blue }};word-break:break-all;">{{ url }}</a>
</p>
