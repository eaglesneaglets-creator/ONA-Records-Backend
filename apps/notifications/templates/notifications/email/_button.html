{# A bulletproof button: a table cell carries the colour, so Outlook (which ignores padding on links) still shows a solid button. Args: url, label. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="ona-btn" style="margin:28px 0 8px;">
  <tr>
    <td align="center" bgcolor="{{ s.primary }}" style="border-radius:10px;background-color:{{ s.primary }};">
      <a href="{{ url }}" target="_blank" style="display:inline-block;padding:14px 26px;font-family:{{ s.font }};font-size:15px;line-height:20px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">{{ label }}&nbsp;&rarr;</a>
    </td>
  </tr>
</table>
