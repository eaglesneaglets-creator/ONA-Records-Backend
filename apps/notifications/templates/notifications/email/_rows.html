{# The booking at a glance: muted labels left, values right, hairlines between — a key/value panel. Rows come from messages.booking_context. #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 0;background-color:{{ s.panel_bg }};border:1px solid {{ s.border }};border-radius:12px;">
  {% for label, value in rows %}
  <tr>
    <td style="padding:12px 18px;{% if not forloop.first %}border-top:1px solid {{ s.border }};{% endif %}font-family:{{ s.font }};font-size:13px;line-height:20px;color:{{ s.mute }};width:34%;vertical-align:top;">{{ label }}</td>
    <td style="padding:12px 18px;{% if not forloop.first %}border-top:1px solid {{ s.border }};{% endif %}font-family:{{ s.font }};font-size:14px;line-height:20px;font-weight:700;color:{{ s.ink }};text-align:right;vertical-align:top;">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
